<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>sadhanas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    h1 {
      font-size: 12px;
      letter-spacing: 0.14em;
      opacity: 0.35;
      font-weight: 400;
      margin-bottom: 2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 155px);
      gap: 10px;
    }
    a {
      background: #1a1a1a;
      border: 0.5px solid #2a2a2a;
      border-radius: 14px;
      padding: 1.25rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #f0f0f0;
      transition: background 0.15s, border-color 0.15s;
    }
    a:hover { background: #222; border-color: #3a3a3a; }
    a.soon { opacity: 0.4; pointer-events: none; }
    .icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .label { font-size: 13px; font-weight: 500; }
    .sub { font-size: 10px; opacity: 0.4; }
  </style>
</head>
<body>
  <h1>sadhanas.app</h1>
  <div class="grid">

    <a href="https://morning.sadhanas.app">
      <div class="icon" style="background:#2a2008;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/>
          <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
          <path d="M2 12h2"/><path d="M20 12h2"/>
          <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      </div>
      <span class="label">Morning</span>
      <span class="sub">morning routine</span>
    </a>

    <a href="https://night.sadhanas.app">
      <div class="icon" style="background:#15142a;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </div>
      <span class="label">SDR</span>
      <span class="sub">shutdown routine</span>
    </a>

    <a href="https://stru.sadhanas.app">
      <div class="icon" style="background:#2a1500;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <span class="label">Stru</span>
      <span class="sub">time structuring</span>
    </a>

    <a href="https://habits.sadhanas.app">
      <div class="icon" style="background:#2a0f1a;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f575a9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
      </div>
      <span class="label">Habits</span>
      <span class="sub">habit tracker</span>
    </a>

    <a class="soon" href="#">
      <div class="icon" style="background:#1a1a1a;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/>
        </svg>
      </div>
      <span class="label">Stoa</span>
      <span class="sub">coming soon</span>
    </a>

  </div>
</body>
</html>
