<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sadhanas</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --panel-border: #e7e3db;
      --panel-hover: #f6f2eb;
      --text: #1e1a15;
      --muted: #72685c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Nunito", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 1.5rem 2rem;
    }

    h1 {
      font-size: 15px;
      letter-spacing: 0.14em;
      opacity: 0.55;
      font-weight: 700;
      margin-bottom: 0;
      text-transform: uppercase;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(100%, 980px);
      margin-bottom: 1.5rem;
    }

    .intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin: 1rem 0 1.5rem;
      text-align: center;
    }

    .welcome {
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0.07em;
      color: var(--text);
    }

    .datetime {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      font-size: 15px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .datetime-item {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .datetime-icon {
      width: 16px;
      height: 16px;
      color: #b1a287;
      flex: 0 0 auto;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(177, 162, 135, 0.42);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 14px;
      width: min(100%, 980px);
    }

    a {
      min-height: 158px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }

    a:hover {
      background: var(--panel-hover);
      border-color: #d9d0c5;
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(63, 43, 24, 0.08);
    }

    a.soon {
      opacity: 0.4;
      pointer-events: none;
    }

    .icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg,
    .icon img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .label {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.15;
    }

    .sub {
      font-size: 14px;
      line-height: 1.3;
      color: var(--muted);
    }

    .label.compact {
      font-size: 17px;
    }

    .card-wide {
      grid-column: span 2;
    }

    .card-half {
      grid-column: span 2;
    }

    .card-offset-left {
      grid-column: 2 / span 2;
    }

    .card-offset-right {
      grid-column: 4 / span 2;
    }

    @media (max-width: 700px) {
      body {
        justify-content: flex-start;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      a {
        min-height: 164px;
      }

      .card-wide,
      .card-half,
      .card-offset-left,
      .card-offset-right {
        grid-column: auto;
      }

      .datetime {
        flex-direction: column;
        gap: 0.2rem;
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>sadhanas.app</h1>
    <div class="intro">
      <div class="welcome">Welcome back to your sadhana space</div>
      <div class="datetime">
        <span class="datetime-item">
          <svg class="datetime-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 2v4" />
            <path d="M16 2v4" />
            <rect x="3" y="4" width="18" height="18" rx="3" />
            <path d="M3 10h18" />
          </svg>
          <span id="today-date">Monday, March 30</span>
        </span>
        <span class="datetime-item">
          <svg class="datetime-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
          </svg>
          <span id="current-time">12:00 AM</span>
        </span>
      </div>
    </div>
    <div class="divider" aria-hidden="true"></div>
  </div>
  <div class="grid">

    <a class="card-wide" href="https://morning.sadhanas.app">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2" />
          <path d="M12 20v2" />
          <path d="m4.93 4.93 1.41 1.41" />
          <path d="m17.66 17.66 1.41 1.41" />
          <path d="M2 12h2" />
          <path d="M20 12h2" />
          <path d="m6.34 17.66-1.41 1.41" />
          <path d="m19.07 4.93-1.41 1.41" />
        </svg>
      </div>
      <span class="label compact">Morning Routine</span>
      <span class="sub">morning routine</span>
    </a>

    <a class="card-wide" href="https://habits.sadhanas.app">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f575a9" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M9 11l3 3L22 4" />
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
        </svg>
      </div>
      <span class="label compact">Habits Tracker</span>
      <span class="sub">habit tracker</span>
    </a>

    <a class="card-wide" href="https://night.sadhanas.app">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
      </div>
      <span class="label compact">Shutdown Routine</span>
      <span class="sub">shutdown routine</span>
    </a>

    <a class="card-half card-offset-left" href="https://stoa.sadhanas.app/">
      <div class="icon">
        <img src="stoa-icon.svg" alt="Stoa icon" />
      </div>
      <span class="label">Stoa</span>
      <span class="sub">stoic reflections and practice</span>
    </a>

    <a class="card-half card-offset-right" href="https://stru.sadhanas.app">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
      </div>
      <span class="label">Stru</span>
      <span class="sub">time structuring</span>
    </a>

  </div>
  <script>
    const dateEl = document.getElementById("today-date");
    const timeEl = document.getElementById("current-time");

    const formatDate = () =>
      new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric"
      }).format(new Date());

    const formatTime = () =>
      new Intl.DateTimeFormat(undefined, {
        hour: "numeric",
        minute: "2-digit"
      }).format(new Date());

    const updateDateTime = () => {
      dateEl.textContent = formatDate();
      timeEl.textContent = formatTime();
    };

    updateDateTime();
    setInterval(updateDateTime, 1000);
  </script>
</body>

</html>
